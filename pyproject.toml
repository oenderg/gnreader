[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnreader"
version = "0.3.3"
description = "Personal-use reader for the Goodnotes notebook format"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "lz4>=4.0",
  "pypdfium2>=4.0",
  "Pillow>=10.0",
  "protobuf>=6.31,<7",
]

[project.optional-dependencies]
nexus = ["pycrdt>=0.12"]
test = ["pytest>=8", "numpy>=1.26"]

[project.scripts]
gnreader = "gnreader.cli:main"
gnstore = "gnstore.cli:main"
gnlive = "gnlive.cli:main"
gntext = "gntext.__main__:main"

[tool.setuptools]
packages = ["gnreader", "gntext", "gnstore", "gnlive"]
include-package-data = true

[tool.setuptools.package-data]
gnreader = ["capabilities.json"]
